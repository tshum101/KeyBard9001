<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyBard 9001</title>
  <style>
:root {
  --u: 52px;
  --gap: 5px;
  --ink: #1c1c1a;
  --paper: #f3f0e8;
  --board: #d5d1c8;
  --cap: #f7f4ee;
  --cap-edge: #b7b2a8;
  --held: #2f6fed;
  --seen: #2f9e44;
  --muted: #8d887e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 20px 40px;
  background: var(--ink);
  color: var(--paper);
  font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
}

h1 {
  margin: 0 0 6px;
  font-size: 32px;
  font-weight: 650;
  letter-spacing: 0.02em;
}

.hint {
  margin: 0 0 16px;
  max-width: 70ch;
  color: #c8c3b8;
}

.type-label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #c8c3b8;
}

textarea {
  display: block;
  width: min(1066px, 100%);
  min-height: 76px;
  margin-bottom: 14px;
  padding: 10px 12px;
  border: 1px solid #3a3a36;
  border-radius: 8px;
  background: #111;
  color: var(--paper);
  font: 18px/1.4 Consolas, "Cascadia Mono", monospace;
  resize: vertical;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

button {
  border: 1px solid #4a4a44;
  border-radius: 8px;
  background: #2a2a26;
  color: var(--paper);
  padding: 8px 14px;
  font: inherit;
  cursor: pointer;
}

button[aria-pressed="true"] {
  background: var(--paper);
  color: var(--ink);
  border-color: var(--paper);
}

button:disabled {
  opacity: 0.55;
  cursor: default;
}

.mode-test {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px;
  border: 1px dashed var(--seen);
  border-radius: 10px;
}

button.clear {
  padding: 6px 10px;
  background: transparent;
  color: #b7e0be;
  border-color: var(--seen);
  font-size: 14px;
}

button.clear:hover:not(:disabled) {
  background: rgba(47, 158, 68, 0.18);
}

.choice {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  padding: 6px 12px 8px;
  border: 1px solid #4a4a44;
  border-radius: 8px;
}

.choice legend {
  padding: 0 4px;
  color: #c8c3b8;
  font-size: 13px;
}

.choice label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.choice input {
  margin: 0;
}

.stage {
  overflow-x: auto;
  padding-bottom: 8px;
}

.keyboard {
  width: fit-content;
}

.board {
  --inset: 14px;
  position: relative;
  width: calc(20.5 * var(--u) + 2 * var(--inset));
  height: calc(6.6 * var(--u) + 2 * var(--inset));
  background: var(--board);
  border-radius: 12px;
}

.layer {
  margin-left: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  background: #2a2a26;
  color: #d9d3c6;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}

.key {
  position: absolute;
  left: calc(var(--x) * var(--u) + var(--inset));
  top: calc(var(--y) * var(--u) + var(--inset));
  width: calc(var(--w) * var(--u) - var(--gap));
  height: calc(var(--h) * var(--u) - var(--gap));
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--cap-edge);
  border-radius: 6px;
  background: var(--cap);
  color: var(--ink);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.08);
  user-select: none;
}

.face {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1.05;
}

.legend { font-size: 15px; font-weight: 600; }
.sub { font-size: 10px; color: #5e5a53; }
.key.long .legend { font-size: 12px; font-weight: 600; }

.key.silent {
  background: #e6e2d8;
  color: var(--muted);
  border-style: dashed;
}

.key.held {
  background: var(--held);
  color: white;
  border-color: #1d4eb8;
}

.key.held .sub { color: #d6e4ff; }

.key.seen {
  background: var(--seen);
  color: white;
  border-color: #1d6b32;
}

.key.seen .sub { color: #d8ffe4; }

.key.seen.held {
  outline: 3px solid #d7ffe0;
  outline-offset: -4px;
}

p.legend {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  color: #c8c3b8;
  font-size: 14px;
}

.serial {
  width: min(1066px, 100%);
  margin-top: 18px;
}

.serial[hidden] {
  display: none;
}

#serial-state {
  margin: 0 0 6px;
  color: #c8c3b8;
  font-size: 14px;
}

#serial-log {
  min-height: 140px;
  margin-bottom: 8px;
}

.serial-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.serial-row input {
  flex: 1 1 16rem;
  min-width: 12rem;
  padding: 8px 12px;
  border: 1px solid #3a3a36;
  border-radius: 8px;
  background: #111;
  color: var(--paper);
  font: 16px/1.4 Consolas, "Cascadia Mono", monospace;
}

.swatch {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 6px;
  border-radius: 4px;
  vertical-align: -3px;
  border: 1px solid #888;
}

.swatch.held { background: var(--held); border-color: var(--held); }
.swatch.seen { background: var(--seen); border-color: var(--seen); }
.swatch.silent { background: #e6e2d8; border-style: dashed; }

.panel {
  width: min(1066px, 100%);
  margin-top: 16px;
  border: 1px solid #4a4a44;
  border-radius: 10px;
  background: #161614;
}

.panel summary {
  padding: 10px 14px;
  cursor: pointer;
  font-weight: 650;
}

.panel-body {
  display: grid;
  gap: 12px;
  padding: 0 14px 14px;
}

.led-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.led-row span {
  width: 6.5rem;
  color: #c8c3b8;
}

.led-num {
  width: 4.5rem;
  padding: 6px 8px;
  border: 1px solid #3a3a36;
  border-radius: 8px;
  background: #111;
  color: var(--paper);
  font: inherit;
  text-align: right;
}

.led-row input[type="range"] {
  flex: 1;
  accent-color: var(--paper);
}

.led-swatch {
  width: 28px;
  height: 28px;
  border: 1px solid #4a4a44;
  border-radius: 6px;
  background: #000;
}

.led-note {
  margin: 0;
  color: #c8c3b8;
  font-size: 14px;
}

@media (max-width: 1100px) {
  :root { --u: 42px; }
}

@media (max-width: 860px) {
  :root { --u: 34px; }
}

  </style>
</head>
<body>
  <header>
    <h1>KeyBard 9001</h1>
    <p id="hint" class="hint"></p>
  </header>

  <label class="type-label" for="pad">Typing test</label>
  <textarea id="pad" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Click here and type"></textarea>

  <div class="toolbar">
    <button type="button" id="live" aria-pressed="true" title="Keys light only while they are held">Live Mode</button>
    <span class="mode-test">
      <button type="button" id="test" aria-pressed="false" title="Keys stay lit after you press them, so you can see which ones you have tried">Test Mode</button>
      <button type="button" id="clear" class="clear" title="Clear the keys remembered in Test Mode">Clear keys</button>
    </span>
    <fieldset class="choice">
      <legend>Media/Calc</legend>
      <label title="Connect mute, volume, and calculator so they light on the board"><input type="radio" name="media" id="media-on" value="on"> On</label>
      <label title="Disconnect mute, volume, and calculator"><input type="radio" name="media" id="media-off" value="off" checked> Off</label>
    </fieldset>
    <fieldset class="choice">
      <legend>COM</legend>
      <label title="Turn on the USB serial port. Typing and the media keys stay on"><input type="radio" name="com" id="com-on" value="on"> On</label>
      <label title="Turn off the USB serial port"><input type="radio" name="com" id="com-off" value="off" checked> Off</label>
    </fieldset>
    <fieldset class="choice">
      <legend>Capture keys</legend>
      <label title="Hold F1–F12 and the Windows key in this page. Escape turns this off"><input type="radio" name="capture" id="capture-on" value="on"> On</label>
      <label title="Let the browser and Windows handle F1–F12 and the Windows key"><input type="radio" name="capture" id="capture-off" value="off" checked> Off</label>
    </fieldset>
  </div>

  <div class="stage">
    <div class="keyboard">
      <div id="board" class="board"></div>
    </div>
  </div>

  <p class="legend">
    <span class="swatch held"></span> held in Live Mode
    <span class="swatch seen"></span> seen in Test Mode
    <span class="swatch silent"></span> Fn and Keybard are not reported
    <span id="layer" class="layer">Base layer</span>
  </p>

  <details class="panel">
    <summary>LEDs</summary>
    <div class="panel-body">
      <div class="led-row">
        <button type="button" id="led-solid" aria-pressed="false" title="Light all 102 LEDs with the color below. Click again to turn them off">Solid color</button>
        <span id="led-swatch" class="led-swatch" aria-hidden="true"></span>
      </div>
      <div class="led-row">
        <span>Red</span>
        <input id="led-r" type="range" min="0" max="255" value="255" aria-label="Red">
        <input id="led-r-num" class="led-num" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" value="255" aria-label="Red value">
      </div>
      <div class="led-row">
        <span>Green</span>
        <input id="led-g" type="range" min="0" max="255" value="255" aria-label="Green">
        <input id="led-g-num" class="led-num" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" value="255" aria-label="Green value">
      </div>
      <div class="led-row">
        <span>Blue</span>
        <input id="led-b" type="range" min="0" max="255" value="255" aria-label="Blue">
        <input id="led-b-num" class="led-num" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" value="255" aria-label="Blue value">
      </div>
      <div class="led-row">
        <span>Brightness</span>
        <input id="led-bri" type="range" min="0" max="100" value="0" title="0 is off. 100 is 40% of red, green, and blue" aria-label="Brightness">
        <input id="led-bri-num" class="led-num" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" value="0" aria-label="Brightness value" title="0 is off. 100 is 40% of red, green, and blue">
      </div>
      <p id="led-scaled" class="led-note"></p>
      <p id="led-power" class="led-note"></p>
      <p id="led-note" class="led-note"></p>
    </div>
  </details>

  <section class="serial" id="serial-box" aria-label="Virtual COM port" hidden>
    <label class="type-label" for="serial-log">Virtual COM port</label>
    <p id="serial-state"></p>
    <textarea id="serial-log" rows="8" readonly spellcheck="false" placeholder="Keyboard log lines show up here"></textarea>
    <div class="serial-row">
      <input id="serial-cmd" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Type a command and press Enter">
      <button type="button" id="serial-send">Send</button>
      <button type="button" id="serial-open">Open</button>
      <button type="button" id="serial-clear">Clear</button>
    </div>
  </section>

  <script>
const HID_FILTERS = [
  { vendorId: 0x0483, productId: 0x572b, usagePage: 0x0c, usage: 0x01 },
  { vendorId: 0x0483, productId: 0x572c, usagePage: 0x0c, usage: 0x01 }
];

const keys = [];

function add(spec) {
  keys.push({
    code: spec.code || null,
    label: spec.label,
    shift: spec.shift || null,
    sub: spec.sub || null,
    x: spec.x,
    y: spec.y,
    w: spec.w || 1,
    h: spec.h || 1,
    consumer: spec.consumer || 0,
    silent: !!spec.silent,
    where: spec.where || "",
    down: false,
    seen: false,
    seenShift: false,
    el: null,
    legendEl: null,
    subEl: null
  });
}

function row(y, startX, rowNumber, colStart, items) {
  items.forEach(function (item, index) {
    add({
      code: item[0],
      label: item[1],
      shift: item[2] || null,
      x: startX + index,
      y: y,
      where: "R" + rowNumber + " C" + (colStart + index)
    });
  });
}

add({ code: "Escape", label: "Esc", x: 0, y: 0, where: "R1 C1" });
add({ code: "F1", label: "F1", x: 2, y: 0, where: "R1 C3" });
add({ code: "F2", label: "F2", x: 3, y: 0, where: "R1 C4" });
add({ code: "F3", label: "F3", x: 4, y: 0, where: "R1 C5" });
add({ code: "F4", label: "F4", x: 5, y: 0, where: "R1 C6" });
add({ code: "F5", label: "F5", x: 6.5, y: 0, where: "R1 C7" });
add({ code: "F6", label: "F6", x: 7.5, y: 0, where: "R1 C8" });
add({ code: "F7", label: "F7", x: 8.5, y: 0, where: "R1 C9" });
add({ code: "F8", label: "F8", x: 9.5, y: 0, where: "R1 C10" });
add({ code: "F9", label: "F9", x: 11, y: 0, where: "R1 C11" });
add({ code: "F10", label: "F10", x: 12, y: 0, where: "R1 C12" });
add({ code: "F11", label: "F11", x: 13, y: 0, where: "R1 C13" });
add({ code: "F12", label: "F12", x: 14, y: 0, where: "R1 C14" });
add({ label: "Calc", x: 15.5, y: 0, consumer: 0x08, where: "R1 C15" });
add({ code: "AudioVolumeMute", label: "Mute", x: 16.5, y: 0, consumer: 0x01, where: "R1 C16" });
add({ code: "AudioVolumeDown", label: "Vol-", x: 17.5, y: 0, consumer: 0x02, where: "R1 C17" });
add({ code: "AudioVolumeUp", label: "Vol+", x: 18.5, y: 0, consumer: 0x04, where: "R1 C18" });
add({ label: "Keybard", x: 19.5, y: 0, silent: true, where: "R1 C19" });

add({ code: "Backquote", label: "`", shift: "~", x: 0, y: 1.25, where: "R2 C1" });
row(1.25, 1, 2, 2, [
  ["Digit1", "1", "!"],
  ["Digit2", "2", "@"],
  ["Digit3", "3", "#"],
  ["Digit4", "4", "$"],
  ["Digit5", "5", "%"],
  ["Digit6", "6", "^"],
  ["Digit7", "7", "&"],
  ["Digit8", "8", "*"],
  ["Digit9", "9", "("],
  ["Digit0", "0", ")"],
  ["Minus", "-", "_"],
  ["Equal", "=", "+"]
]);
add({ code: "Backspace", label: "Backspace", x: 13, y: 1.25, w: 2, where: "R2 C14" });
add({ code: "Delete", label: "Delete", x: 15.5, y: 1.25, where: "R2 C15" });
add({ code: "NumLock", label: "Num", x: 16.5, y: 1.25, where: "R2 C16" });
add({ code: "NumpadDivide", label: "/", x: 17.5, y: 1.25, where: "R2 C17" });
add({ code: "NumpadMultiply", label: "*", x: 18.5, y: 1.25, where: "R2 C18" });
add({ code: "NumpadSubtract", label: "-", x: 19.5, y: 1.25, where: "R2 C19" });

add({ code: "Tab", label: "Tab", x: 0, y: 2.25, w: 1.5, where: "R3 C1" });
row(2.25, 1.5, 3, 2, [
  ["KeyQ", "q", "Q"],
  ["KeyW", "w", "W"],
  ["KeyE", "e", "E"],
  ["KeyR", "r", "R"],
  ["KeyT", "t", "T"],
  ["KeyY", "y", "Y"],
  ["KeyU", "u", "U"],
  ["KeyI", "i", "I"],
  ["KeyO", "o", "O"],
  ["KeyP", "p", "P"]
]);
add({ code: "BracketLeft", label: "[", shift: "{", x: 11.5, y: 2.25, where: "R3 C12" });
add({ code: "BracketRight", label: "]", shift: "}", x: 12.5, y: 2.25, where: "R3 C13" });
add({ code: "Backslash", label: "\\", shift: "|", x: 13.5, y: 2.25, w: 1.5, where: "R3 C14" });
add({ code: "Home", label: "Home", x: 15.5, y: 2.25, where: "R3 C15" });
add({ code: "Numpad7", label: "7", shift: "Home", sub: "Home", x: 16.5, y: 2.25, where: "R3 C16" });
add({ code: "Numpad8", label: "8", shift: "Up", sub: "Up", x: 17.5, y: 2.25, where: "R3 C17" });
add({ code: "Numpad9", label: "9", shift: "PgUp", sub: "PgUp", x: 18.5, y: 2.25, where: "R3 C18" });
add({ code: "NumpadAdd", label: "+", x: 19.5, y: 2.25, h: 2, where: "R3 C19" });

add({ code: "CapsLock", label: "Caps", x: 0, y: 3.25, w: 1.75, where: "R4 C1" });
row(3.25, 1.75, 4, 2, [
  ["KeyA", "a", "A"],
  ["KeyS", "s", "S"],
  ["KeyD", "d", "D"],
  ["KeyF", "f", "F"],
  ["KeyG", "g", "G"],
  ["KeyH", "h", "H"],
  ["KeyJ", "j", "J"],
  ["KeyK", "k", "K"],
  ["KeyL", "l", "L"]
]);
add({ code: "Semicolon", label: ";", shift: ":", x: 10.75, y: 3.25, where: "R4 C11" });
add({ code: "Quote", label: "'", shift: "\"", x: 11.75, y: 3.25, where: "R4 C12" });
add({ code: "Enter", label: "Enter", x: 12.75, y: 3.25, w: 2.25, where: "R4 C14" });
add({ code: "End", label: "End", x: 15.5, y: 3.25, where: "R4 C15" });
add({ code: "Numpad4", label: "4", shift: "Left", sub: "Left", x: 16.5, y: 3.25, where: "R4 C16" });
add({ code: "Numpad5", label: "5", x: 17.5, y: 3.25, where: "R4 C17" });
add({ code: "Numpad6", label: "6", shift: "Right", sub: "Right", x: 18.5, y: 3.25, where: "R4 C18" });

add({ code: "ShiftLeft", label: "Shift", x: 0, y: 4.25, w: 2.25, where: "R5 C1" });
row(4.25, 2.25, 5, 2, [
  ["KeyZ", "z", "Z"],
  ["KeyX", "x", "X"],
  ["KeyC", "c", "C"],
  ["KeyV", "v", "V"],
  ["KeyB", "b", "B"],
  ["KeyN", "n", "N"],
  ["KeyM", "m", "M"]
]);
add({ code: "Comma", label: ",", shift: "<", x: 9.25, y: 4.25, where: "R5 C9" });
add({ code: "Period", label: ".", shift: ">", x: 10.25, y: 4.25, where: "R5 C10" });
add({ code: "Slash", label: "/", shift: "?", x: 11.25, y: 4.25, where: "R5 C11" });
add({ code: "ShiftRight", label: "Shift", x: 12.25, y: 4.25, w: 1.75, where: "R5 C12" });
add({ code: "ArrowUp", label: "Up", x: 14.25, y: 4.5, where: "R5 C15" });
add({ code: "Numpad1", label: "1", shift: "End", sub: "End", x: 16.5, y: 4.25, where: "R5 C16" });
add({ code: "Numpad2", label: "2", shift: "Down", sub: "Down", x: 17.5, y: 4.25, where: "R5 C17" });
add({ code: "Numpad3", label: "3", shift: "PgDn", sub: "PgDn", x: 18.5, y: 4.25, where: "R5 C18" });
add({ code: "NumpadEnter", label: "Enter", x: 19.5, y: 4.25, h: 2, where: "R5 C19" });

add({ code: "ControlLeft", label: "Ctrl", x: 0, y: 5.25, w: 1.25, where: "R6 C1" });
add({ code: "MetaLeft", label: "Win", x: 1.25, y: 5.25, w: 1.25, where: "R6 C2" });
add({ code: "AltLeft", label: "Alt", x: 2.5, y: 5.25, w: 1.25, where: "R6 C3" });
add({ code: "Space", label: "Space", x: 3.75, y: 5.25, w: 6.25, where: "R6 C4" });
add({ code: "AltRight", label: "Alt", x: 10, y: 5.25, where: "R6 C10" });
add({ label: "Fn", x: 11, y: 5.25, silent: true, where: "R6 C11" });
add({ code: "ControlRight", label: "Ctrl", x: 12, y: 5.25, where: "R6 C12" });
add({ code: "ArrowLeft", label: "Left", x: 13.25, y: 5.5, where: "R6 C14" });
add({ code: "ArrowDown", label: "Down", x: 14.25, y: 5.5, where: "R6 C15" });
add({ code: "ArrowRight", label: "Right", x: 15.25, y: 5.5, where: "R6 C16" });
add({ code: "Numpad0", label: "0", shift: "Ins", sub: "Ins", x: 16.5, y: 5.25, w: 2, where: "R6 C17" });
add({ code: "NumpadDecimal", label: ".", shift: "Del", sub: "Del", x: 18.5, y: 5.25, where: "R6 C18" });

const byCode = new Map();
keys.forEach(function (item) {
  if (item.code) byCode.set(item.code, item);
});

/* Windows reports Shift+numpad as the navigation key. location 3 is the numpad. */
const NUMPAD_ALIAS = {
  Home: "Numpad7",
  ArrowUp: "Numpad8",
  PageUp: "Numpad9",
  ArrowLeft: "Numpad4",
  ArrowRight: "Numpad6",
  End: "Numpad1",
  ArrowDown: "Numpad2",
  PageDown: "Numpad3",
  Insert: "Numpad0",
  Delete: "NumpadDecimal"
};

const SWALLOW = {
  MetaLeft: true,
  MetaRight: true
};
for (let fn = 1; fn <= 12; fn += 1) SWALLOW["F" + fn] = true;

function keyFromEvent(event) {
  let code = event.code;
  if (event.location === 3 && NUMPAD_ALIAS[code]) code = NUMPAD_ALIAS[code];
  return byCode.get(code) || null;
}

const board = document.getElementById("board");

const serialClear = document.getElementById("serial-clear");
const serialState = document.getElementById("serial-state");

let mode = "live";
let hidDevice = null;
let solidOn = false;
let ledBusy = false;
let ledWantSend = false;
let ledNote = "";
let hidNote = "";
let comOn = false;
let comBusy = false;
let mediaBusy = false;
let captureOn = false;
let captureBusy = false;
let comOffNext = false;
let serialPort = null;
let serialReader = null;
let serialNote = "";
let serialWatch = 0;
let serialOpening = false;
let serialLastError = "";
const COM_PID = 0x572c;
const comAllowed = window.isSecureContext && (!!navigator.hid || !!navigator.serial);

keys.forEach(function (item) {
  const el = document.createElement("div");
  el.className = "key" + (item.silent ? " silent" : "") + (item.label.length > 4 ? " long" : "");
  el.style.setProperty("--x", String(item.x));
  el.style.setProperty("--y", String(item.y));
  el.style.setProperty("--w", String(item.w));
  el.style.setProperty("--h", String(item.h));
  el.title = item.where + (item.silent ? " is not reported" : "");

  const face = document.createElement("span");
  face.className = "face";
  const legend = document.createElement("span");
  legend.className = "legend";
  face.appendChild(legend);
  let sub = null;
  if (item.sub) {
    sub = document.createElement("span");
    sub.className = "sub";
    sub.textContent = item.sub;
    face.appendChild(sub);
  }
  el.appendChild(face);
  board.appendChild(el);
  item.el = el;
  item.legendEl = legend;
  item.subEl = sub;
});

function shiftHeld() {
  const left = byCode.get("ShiftLeft");
  const right = byCode.get("ShiftRight");
  return !!(left && left.down) || !!(right && right.down);
}

function showingShift(item) {
  return !!(item.shift && shiftHeld());
}

function remembered(item) {
  return showingShift(item) ? item.seenShift : item.seen;
}

function remember(item) {
  if (mode !== "test" || item.silent) return;
  if (showingShift(item)) item.seenShift = true;
  else item.seen = true;
}

function paint() {
  const shifted = shiftHeld();
  layerEl.textContent = shifted ? "Shift layer" : "Base layer";
  keys.forEach(function (item) {
    const showShift = showingShift(item);
    item.legendEl.textContent = showShift ? item.shift : item.label;
    if (item.subEl) item.subEl.hidden = showShift;
    item.el.classList.toggle("held", item.down && !item.silent);
    item.el.classList.toggle("seen", mode === "test" && remembered(item));
  });
  clearButton.disabled = mode !== "test";
  const mediaOn = !!hidDevice;
  const mediaAllowed = window.isSecureContext && !!navigator.hid;
  if (!mediaBusy) {
    mediaOnRadio.checked = mediaOn;
    mediaOffRadio.checked = !mediaOn;
  }
  mediaOnRadio.disabled = !mediaAllowed || mediaBusy;
  mediaOffRadio.disabled = !mediaAllowed || mediaBusy;
  if (!comBusy) {
    comOnRadio.checked = comOn;
    comOffRadio.checked = !comOn;
  }
  comOnRadio.disabled = !comAllowed || comBusy;
  comOffRadio.disabled = !comAllowed || comBusy;
  if (!captureBusy) {
    captureOnRadio.checked = captureOn;
    captureOffRadio.checked = !captureOn;
  }
  captureOnRadio.disabled = captureBusy;
  captureOffRadio.disabled = captureBusy;
  paintSerial();
  paintLed();
}

function ledChannel(value, brightness) {
  return Math.floor(value * brightness * LED_LEVEL_PERCENT / 10000);
}

function paintLed() {
  const red = Number(ledR.value);
  const green = Number(ledG.value);
  const blue = Number(ledB.value);
  const brightness = Number(ledBri.value);
  const scaledRed = ledChannel(red, brightness);
  const scaledGreen = ledChannel(green, brightness);
  const scaledBlue = ledChannel(blue, brightness);
  const milliamps = Math.round(102 * 12 * (scaledRed + scaledGreen + scaledBlue) / 255);
  ledFields.forEach(function (field) {
    if (document.activeElement !== field.box) field.box.value = field.slider.value;
  });
  ledScaled.textContent = "Scaled color " + scaledRed + ", " + scaledGreen + ", " + scaledBlue + ". Brightness 100 is 40% of red, green, and blue.";
  ledPower.textContent = (solidOn ? "Solid color is on. " : "Solid color is off, so the LEDs stay dark. ") + "This color is about " + milliamps + " mA. White at brightness 100 is about 1470 mA. The keyboard asks USB for 100 mA.";
  ledSwatch.style.background = "rgb(" + scaledRed + ", " + scaledGreen + ", " + scaledBlue + ")";
  solidButton.setAttribute("aria-pressed", solidOn ? "true" : "false");
  solidButton.disabled = ledBusy || !window.isSecureContext || !navigator.hid;
  ledNoteEl.textContent = ledNote;
}

function ledPayload(enabled) {
  return new Uint8Array([
    2,
    enabled ? 1 : 0,
    Number(ledR.value),
    Number(ledG.value),
    Number(ledB.value),
    Number(ledBri.value)
  ]);
}

function featureReportId(device) {
  return device && device.productId === 0x572c ? 3 : 0;
}

async function flushLed() {
  if (ledBusy) {
    ledWantSend = true;
    return;
  }
  ledBusy = true;
  paintLed();
  try {
    let device = hidDevice;
    if (!device) {
      device = await openConsumer();
      if (!device) {
        solidOn = false;
        ledNote = "Choose the keyboard to set the LEDs";
        return;
      }
    }
    do {
      ledWantSend = false;
      await device.sendFeatureReport(featureReportId(device), ledPayload(solidOn));
      ledNote = "";
    } while (ledWantSend);
  } catch (error) {
    if (!hidDevice) solidOn = false;
    ledNote = error && error.name === "NotAllowedError"
      ? "Choose the keyboard to set the LEDs"
      : "LED command did not reach the keyboard";
  } finally {
    ledBusy = false;
    paint();
  }
}

function setMode(next) {
  mode = next;
  liveButton.setAttribute("aria-pressed", next === "live" ? "true" : "false");
  testButton.setAttribute("aria-pressed", next === "test" ? "true" : "false");
  paint();
  pad.focus();
}

function clearMemory() {
  keys.forEach(function (item) {
    item.seen = false;
    item.seenShift = false;
  });
  paint();
  pad.focus();
}

function releaseTypingKeys() {
  keys.forEach(function (item) {
    if (!item.consumer) item.down = false;
  });
  paint();
}

function onKeyDown(event) {
  if (captureOn && SWALLOW[event.code]) event.preventDefault();
  const item = keyFromEvent(event);
  if (!item || item.silent) return;
  if (hidDevice && item.consumer) return;
  if (event.repeat) return;
  item.down = true;
  remember(item);
  paint();
}

function onKeyUp(event) {
  if (captureOn && SWALLOW[event.code]) event.preventDefault();
  const item = keyFromEvent(event);
  if (!item || item.silent) return;
  if (hidDevice && item.consumer) return;
  item.down = false;
  paint();
}

function applyConsumer(value) {
  keys.forEach(function (item) {
    if (!item.consumer) return;
    const now = (value & item.consumer) !== 0;
    if (now && !item.down) remember(item);
    item.down = now;
  });
  paint();
}

function watchDevice(device) {
  hidDevice = device;
  hidNote = "";
  device.addEventListener("inputreport", function (event) {
    if (event.data.byteLength < 1) return;
    applyConsumer(event.data.getUint8(0));
  });
  paint();
}

async function openDevice(device) {
  if (!device.opened) await device.open();
  watchDevice(device);
}

async function closeMedia() {
  if (!hidDevice) return;
  try {
    await hidDevice.close();
  } catch (error) {
    /* The device may already be gone. */
  }
  keys.forEach(function (item) {
    if (item.consumer) item.down = false;
  });
  hidDevice = null;
  hidNote = "media buttons off";
}

async function setMedia(enabled) {
  if (mediaBusy) return;
  if (enabled === !!hidDevice) return;
  mediaBusy = true;
  paint();
  try {
    if (enabled) await connect();
    else await closeMedia();
  } finally {
    mediaBusy = false;
    paint();
  }
}

async function connect() {
  if (!navigator.hid) return;
  try {
    const devices = await navigator.hid.requestDevice({ filters: HID_FILTERS });
    if (devices[0]) await openDevice(devices[0]);
    else {
      hidNote = "Connect canceled";
      paint();
    }
  } catch (error) {
    hidNote = "Connect canceled";
    paint();
  }
  pad.focus();
}

async function restoreDevice() {
  if (!navigator.hid) {
    hidNote = "this browser has no WebHID";
    paint();
    return;
  }
  if (!window.isSecureContext) {
    hidNote = "open this page from localhost to connect volume and calculator";
    paint();
    return;
  }
  hidNote = "choose Media On for mute, volume, and calculator";
  if (await attachGrantedConsumer()) return;
  paint();
}

function isConsumerDevice(device) {
  if (!device || device.vendorId !== 0x0483) return false;
  if (device.productId !== 0x572b && device.productId !== 0x572c) return false;
  if (!device.collections || device.collections.length === 0) return true;
  return device.collections.some(function (collection) {
    return collection.usagePage === 0x0c && collection.usage === 0x01;
  });
}

async function attachGrantedConsumer() {
  if (!navigator.hid || !window.isSecureContext) return false;
  const want = comOn ? 0x572c : 0x572b;
  if (hidDevice && hidDevice.productId === want && hidDevice.opened) return true;
  const devices = await navigator.hid.getDevices();
  for (let index = 0; index < devices.length; index += 1) {
    const device = devices[index];
    if (!isConsumerDevice(device) || device.productId !== want) continue;
    try {
      await openDevice(device);
      return true;
    } catch (error) {
      /* That grant is not the device plugged in now. */
    }
  }
  return false;
}

let consumerWatch = 0;

async function watchConsumer() {
  const token = ++consumerWatch;
  const wantOn = comOn;
  for (let index = 0; index < 40; index += 1) {
    if (token !== consumerWatch || comOn !== wantOn) return;
    if (await attachGrantedConsumer()) return;
    await delay(250);
  }
}

hintEl.textContent = "Open this file in Chrome. Shift shows the second legend, including the numpad. F1–F12 and the Windows key stay with the browser until Capture keys is On. Escape turns capture off. COM port keeps the keyboard and adds a USB serial device. Serve this page from localhost to switch it. After the COM port is on, its box reads the keyboard log. Type a line there and press Enter to send it.";

async function setCapture(enabled) {
  if (captureBusy || enabled === captureOn) return;
  captureBusy = true;
  paint();
  try {
    if (!enabled) {
      captureOn = false;
      if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
      if (document.fullscreenElement) await document.exitFullscreen();
    } else {
      await document.documentElement.requestFullscreen();
      if (navigator.keyboard && navigator.keyboard.lock) {
        const codes = ["MetaLeft", "MetaRight"];
        for (let fn = 1; fn <= 12; fn += 1) codes.push("F" + fn);
        await navigator.keyboard.lock(codes);
      }
      captureOn = true;
    }
  } catch (error) {
    captureOn = false;
    if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
    if (document.fullscreenElement) {
      try { await document.exitFullscreen(); } catch (exitError) { /* Already left fullscreen. */ }
    }
  } finally {
    captureBusy = false;
    paint();
    pad.focus();
  }
}

async function openConsumer() {
  if (hidDevice) return hidDevice;
  const devices = await navigator.hid.requestDevice({ filters: HID_FILTERS });
  if (!devices[0]) return null;
  await openDevice(devices[0]);
  return hidDevice;
}

async function turnComOn() {
  if (!navigator.hid) {
    hidNote = "this browser has no WebHID";
    return false;
  }
  const device = hidDevice || await openConsumer();
  if (!device) return false;
  await device.sendFeatureReport(featureReportId(device), new Uint8Array([1, 0, 0, 0, 0, 0]));
  comOn = true;
  comOffNext = false;
  hidNote = "COM port on. Typing, volume, mute, and calculator stay on";
  return true;
}

function isComPort(port) {
  if (!port || !port.getInfo) return false;
  const info = port.getInfo();
  return info.usbVendorId === 0x0483 && info.usbProductId === COM_PID;
}

function serialVidPid() {
  if (!serialPort || !serialPort.getInfo) return "";
  const info = serialPort.getInfo();
  const vid = (info.usbVendorId || 0).toString(16).padStart(4, "0");
  const pid = (info.usbProductId || 0).toString(16).padStart(4, "0");
  return vid + ":" + pid;
}

function serialFailText(error) {
  const message = error && error.message ? String(error.message) : "";
  if (/failed to open|access|denied|busy|network/i.test(message)) {
    return "COM port is in use. Close the VS Code serial monitor and click Open";
  }
  return message || "Open canceled";
}

function paintSerial() {
  const open = !!(serialPort && serialPort.readable);
  let state = "COM port is off";
  if (!comAllowed) state = "COM port needs localhost";
  else if (comBusy) state = "COM port reconnecting";
  else if (open) state = "Open " + serialVidPid() + ". Type a command and press Enter.";
  else if (serialNote) state = serialNote;
  else if (comOn) state = "COM port is on. Click Open and choose the serial device";
  serialBox.hidden = !comOn;
  serialState.textContent = state;
  serialOpen.disabled = !comAllowed || comBusy || open || serialOpening;
  serialSend.disabled = !open || comBusy;
  serialCmd.disabled = !open || comBusy;
}

function appendSerial(text) {
  serialLog.value += text;
  if (serialLog.value.length > 64000) {
    serialLog.value = serialLog.value.slice(-48000);
  }
  serialLog.scrollTop = serialLog.scrollHeight;
}

function dropSerial(reason) {
  const had = !!serialPort;
  serialPort = null;
  serialReader = null;
  if (reason) serialNote = reason;
  if (!had) {
    paintSerial();
    return;
  }
  paint();
}

async function openSerial(port) {
  if (!port.readable) {
    await port.open({ baudRate: 115200, bufferSize: 4096, flowControl: "none" });
  }
  /* Windows does not deliver CDC bytes until DTR is on. VS Code turns it on;
     Web Serial does not. */
  await port.setSignals({ dataTerminalReady: true, requestToSend: true });
  return port;
}

async function findGrantedPort() {
  if (!navigator.serial) return null;
  const ports = await navigator.serial.getPorts();
  return ports.find(isComPort) || null;
}

async function comPort() {
  if (!navigator.serial) return null;
  const existing = await findGrantedPort();
  if (existing) {
    try {
      return await openSerial(existing);
    } catch (error) {
      /* The saved port is not the one plugged in now. */
    }
  }
  const picked = await navigator.serial.requestPort({
    filters: [{ usbVendorId: 0x0483, usbProductId: COM_PID }]
  });
  if (!picked) return null;
  return openSerial(picked);
}

async function startSerialRead() {
  if (serialReader || !serialPort || !serialPort.readable) return;
  const port = serialPort;
  let reader;
  try {
    reader = port.readable.getReader();
  } catch (error) {
    return;
  }
  serialReader = reader;
  appendSerial("[COM port open]\n");
  const decoder = new TextDecoder();
  let stopNote = "";
  try {
    while (serialPort === port) {
      const result = await reader.read();
      if (serialPort !== port) break;
      if (result.done) break;
      if (result.value && result.value.byteLength) {
        appendSerial(decoder.decode(result.value, { stream: true }));
      }
    }
  } catch (error) {
    stopNote = "Serial read stopped. Close the VS Code serial monitor and click Open";
    if (serialPort === port) appendSerial("\n[" + stopNote + "]\n");
  } finally {
    try { reader.releaseLock(); } catch (error) { /* The device may already be gone. */ }
    if (serialReader === reader) serialReader = null;
    if (serialPort === port) dropSerial(stopNote || "COM port closed");
  }
}

async function adoptPort(port) {
  if (!port || serialPort || serialOpening) return false;
  serialOpening = true;
  try {
    await openSerial(port);
    if (serialPort) return true;
    serialPort = port;
    serialNote = "";
    comOn = true;
    comOffNext = false;
    hidNote = "COM port on. Typing, volume, mute, and calculator stay on";
    paint();
    startSerialRead();
    return true;
  } catch (error) {
    serialLastError = serialFailText(error);
    return false;
  } finally {
    serialOpening = false;
    paintSerial();
  }
}

function delay(ms) {
  return new Promise(function (resolve) { setTimeout(resolve, ms); });
}

async function watchGrantedSerial() {
  const token = ++serialWatch;
  serialNote = "Waiting for the COM port";
  paintSerial();
  try {
    for (let i = 0; i < 40; i += 1) {
      if (token !== serialWatch || serialPort) return;
      const found = await findGrantedPort();
      if (token !== serialWatch || serialPort) return;
      if (found) {
        if (await adoptPort(found)) return;
      }
      await delay(250);
    }
    if (token !== serialWatch || serialPort) return;
    serialNote = serialLastError || "Click Open and choose the serial device";
    paintSerial();
  } catch (error) {
    if (token !== serialWatch || serialPort) return;
    serialNote = serialFailText(error);
    paintSerial();
  }
}

async function openComBox() {
  if (!navigator.serial || !window.isSecureContext) {
    serialNote = "Serve this page from localhost to open the COM port";
    paintSerial();
    return;
  }
  if ((serialPort && serialPort.readable) || serialOpening) {
    if (serialPort && serialPort.readable) serialCmd.focus();
    return;
  }
  serialOpening = true;
  serialWatch += 1;
  try {
    const port = await comPort();
    if (!port || serialPort) return;
    serialPort = port;
    serialNote = "";
    comOn = true;
    comOffNext = false;
    hidNote = "COM port on. Typing, volume, mute, and calculator stay on";
    paint();
    startSerialRead();
    serialCmd.focus();
  } catch (error) {
    serialNote = serialFailText(error);
    appendSerial("[" + serialNote + "]\n");
    paintSerial();
  } finally {
    serialOpening = false;
    paintSerial();
  }
}

async function sendSerialLine() {
  const text = serialCmd.value.trim();
  if (!text) return;
  if (!serialPort || !serialPort.writable) {
    serialNote = "Open the COM port first";
    paintSerial();
    return;
  }
  const turningOff = text === "KB9 VCP 0";
  const writer = serialPort.writable.getWriter();
  try {
    await writer.write(new TextEncoder().encode(text + "\n"));
    appendSerial("> " + text + "\n");
    serialCmd.value = "";
    if (turningOff) {
      serialWatch += 1;
      comOn = false;
      comOffNext = false;
      hidNote = "COM port off";
      serialNote = "COM port off";
      paint();
    }
  } catch (error) {
    appendSerial("> " + text + "\n");
    if (turningOff) {
      serialWatch += 1;
      comOn = false;
      comOffNext = false;
      hidNote = "COM port off";
      serialNote = "COM port off";
      paint();
    } else {
      serialNote = "Send failed";
      paintSerial();
    }
  } finally {
    try { writer.releaseLock(); } catch (error) { /* The port can drop as soon as the command lands. */ }
  }
  if (serialCmd.disabled === false) serialCmd.focus();
}

async function turnComOff() {
  if (!navigator.serial) {
    hidNote = "this browser has no Web Serial";
    return false;
  }
  serialWatch += 1;
  const port = serialPort || await comPort();
  if (!port) return false;
  const writer = port.writable.getWriter();
  try {
    await writer.write(new TextEncoder().encode("KB9 VCP 0\n"));
  } finally {
    try { writer.releaseLock(); } catch (error) { /* The port can drop as soon as the command lands. */ }
  }
  comOn = false;
  comOffNext = false;
  hidNote = "COM port off";
  serialNote = "COM port off";
  return true;
}

async function setCom(enabled) {
  if (comBusy) return;
  if (enabled && comOn && !comOffNext) return;
  comBusy = true;
  paint();
  try {
    if (!enabled) await turnComOff();
    else {
      const turnedOn = await turnComOn();
      if (!turnedOn) {
        comOffNext = true;
        hidNote = "No consumer HID. If the COM port is already on, choose COM Off and pick the serial device";
      } else {
        watchGrantedSerial();
      }
    }
  } catch (error) {
    if (!enabled || comOn || comOffNext) {
      comOffNext = false;
      hidNote = "COM port switch canceled";
    } else {
      comOffNext = true;
      hidNote = "COM switch did not finish. Choose COM Off and pick the serial device if it is already on";
    }
  }
  comBusy = false;
  paint();
  watchConsumer();
  pad.focus();
}

solidButton.addEventListener("click", function () {
  if (solidButton.disabled) return;
  solidOn = !solidOn;
  paintLed();
  flushLed();
});
ledFields.forEach(function (field) {
  field.slider.addEventListener("input", function () {
    paintLed();
    if (solidOn) flushLed();
  });
  field.box.addEventListener("input", function () {
    const text = field.box.value.trim();
    if (!/^\d+$/.test(text)) return;
    const clamped = Math.max(0, Math.min(field.max, Number(text)));
    field.slider.value = String(clamped);
    if (clamped !== Number(text)) field.box.value = String(clamped);
    paintLed();
    if (solidOn) flushLed();
  });
  field.box.addEventListener("change", function () {
    const text = field.box.value.trim();
    const parsed = /^\d+$/.test(text) ? Number(text) : Number(field.slider.value);
    const clamped = Math.max(0, Math.min(field.max, parsed));
    const changed = String(clamped) !== field.slider.value;
    field.slider.value = String(clamped);
    field.box.value = String(clamped);
    paintLed();
    if (changed && solidOn) flushLed();
  });
  field.box.addEventListener("keydown", function (event) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    field.box.blur();
  });
});
liveButton.addEventListener("click", function () { setMode("live"); });
testButton.addEventListener("click", function () { setMode("test"); });
clearButton.addEventListener("click", clearMemory);
mediaOnRadio.addEventListener("change", function () {
  if (mediaOnRadio.checked) setMedia(true);
});
mediaOffRadio.addEventListener("change", function () {
  if (mediaOffRadio.checked) setMedia(false);
});
comOnRadio.addEventListener("change", function () {
  if (comOnRadio.checked) setCom(true);
});
comOffRadio.addEventListener("change", function () {
  if (comOffRadio.checked) setCom(false);
});
comOffRadio.addEventListener("click", function () {
  if (comOffNext) setCom(false);
});
serialSend.addEventListener("click", sendSerialLine);
serialOpen.addEventListener("click", openComBox);
serialClear.addEventListener("click", function () {
  serialLog.value = "";
  if (serialCmd.disabled === false) serialCmd.focus();
});
serialCmd.addEventListener("keydown", function (event) {
  if (event.key !== "Enter") return;
  event.preventDefault();
  sendSerialLine();
});
captureOnRadio.addEventListener("change", function () {
  if (captureOnRadio.checked) setCapture(true);
});
captureOffRadio.addEventListener("change", function () {
  if (captureOffRadio.checked) setCapture(false);
});
document.addEventListener("fullscreenchange", function () {
  if (document.fullscreenElement) return;
  captureOn = false;
  if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
  paint();
});
window.addEventListener("keydown", onKeyDown, true);
window.addEventListener("keyup", onKeyUp, true);
window.addEventListener("blur", releaseTypingKeys);

if (navigator.serial) {
  navigator.serial.addEventListener("connect", function (event) {
    const port = event.port || event.target;
    if (!isComPort(port) || serialPort) return;
    adoptPort(port);
  });
  navigator.serial.addEventListener("disconnect", function (event) {
    const port = event.port || event.target;
    if (!serialPort) return;
    if (port && port !== serialPort) return;
    comOn = false;
    comOffNext = false;
    hidNote = "COM port off";
    dropSerial("COM port closed");
  });
}

if (navigator.hid) {
  navigator.hid.addEventListener("disconnect", function (event) {
    if (hidDevice && event.device === hidDevice) {
      keys.forEach(function (item) {
        if (item.consumer) item.down = false;
      });
      hidDevice = null;
      hidNote = comOn ? "COM port on. Typing, volume, mute, and calculator stay on" : "keyboard disconnected";
      paint();
    }
  });
}

pad.focus();
paint();
restoreDevice();

  </script>
</body>
</html>
